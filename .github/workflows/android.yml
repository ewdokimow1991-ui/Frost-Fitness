name: Android CI
on:
  push:
    branches: [ main, complete-app ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct approved welcome artwork
        run: |
          test -s .github/welcome_chunks/welcome_001.b64
          test -s .github/welcome_chunks/welcome_002.b64
          test -s .github/welcome_chunks/welcome_003.b64
          mkdir -p app/src/main/res/drawable-nodpi
          cat .github/welcome_chunks/welcome_001.b64 .github/welcome_chunks/welcome_002.b64 .github/welcome_chunks/welcome_003.b64 | tr -d '\r\n' | base64 -d > app/src/main/res/drawable-nodpi/welcome.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/drawable-nodpi/welcome.jpg')
          d = p.read_bytes()
          assert d[:2] == b'\xff\xd8' and d[-2:] == b'\xff\xd9', 'welcome.jpg is not a complete JPEG'
          assert len(d) == 17057, f'unexpected welcome.jpg size: {len(d)}'
          print('WELCOME_JPEG_OK', len(d))
          PY
      - name: Apply approved welcome UI
        run: python3 .github/scripts/apply_welcome.py
      - name: Verify approved welcome UI
        run: |
          grep -q 'R.drawable.welcome' app/src/main/java/com/frostfitness/app/MainActivity.kt
          grep -q 'обработку персональных данных' app/src/main/java/com/frostfitness/app/MainActivity.kt
      - name: Restore stable signing key
        run: base64 -d app/signing-key.b64 > app/frost-fitness.jks
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK created
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Fitness-0.8.1-approved-welcome-apk
          path: app/build/outputs/apk/debug/app-debug.apk
