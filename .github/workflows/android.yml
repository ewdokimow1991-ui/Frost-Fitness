name: Android CI
on:
  push:
    branches: [ main, complete-app ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore approved welcome artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          tr -d '\r\n ' < welcome.part001.b64 | base64 --decode > app/src/main/res/drawable-nodpi/welcome.webp
          test -s app/src/main/res/drawable-nodpi/welcome.webp
          file app/src/main/res/drawable-nodpi/welcome.webp
      - name: Restore stable signing key
        run: base64 -d app/signing-key.b64 > app/frost-fitness.jks
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Fitness-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
