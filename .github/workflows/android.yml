name: Android CI
on:
  push:
    branches: [ main, complete-app ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore approved welcome artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import base64, pathlib, re
          src = pathlib.Path('welcome.part001.b64').read_text(encoding='utf-8')
          payload = re.sub(r'[^A-Za-z0-9+/=]', '', src)
          payload += '=' * (-len(payload) % 4)
          data = base64.b64decode(payload, validate=False)
          out = pathlib.Path('app/src/main/res/drawable-nodpi/welcome.webp')
          out.write_bytes(data)
          if not data.startswith(b'RIFF') or data[8:12] != b'WEBP':
              raise SystemExit('welcome artwork is not a valid WebP payload')
          print(f'Restored {len(data)} bytes to {out}')
          PY
          test -s app/src/main/res/drawable-nodpi/welcome.webp
          file app/src/main/res/drawable-nodpi/welcome.webp
      - name: Restore stable signing key
        run: base64 -d app/signing-key.b64 > app/frost-fitness.jks
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Frost-Fitness-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
