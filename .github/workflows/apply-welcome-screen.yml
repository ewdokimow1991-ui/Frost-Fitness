name: Apply approved welcome screen

on:
  push:
    paths:
      - 'welcome.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply welcome screen
        shell: bash
        run: |
          set -euo pipefail
          test -f welcome.ready
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          payload=''.join(p.read_text(encoding='utf-8') for p in sorted(Path('.').glob('welcome.part*.b64')))
          payload=re.sub(r'[^A-Za-z0-9+/=]','',payload)
          payload += '=' * (-len(payload) % 4)
          data=base64.b64decode(payload, validate=False)
          if not data.startswith(b'RIFF') or data[8:12] != b'WEBP':
              raise SystemExit('Welcome artwork is not a valid WebP')
          Path('app/src/main/res/drawable-nodpi/welcome.webp').write_bytes(data)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/frostfitness/app/MainActivity.kt')
          s=p.read_text()
          old='@Composable fun Welcome(next:()->Unit)=Page("Добро пожаловать\\nв Frost Fitness","Твой персональный путь к форме начинается здесь."){Card{Text("Фростик — твой спортивный помощник",fontSize=24.sp,fontWeight=FontWeight.Bold);Text("Помогу настроить тренировки и следить за прогрессом.",color=UiSub)};Primary("Заполнить анкету",click=next)}'
          new='''@Composable fun Welcome(next:()->Unit){
 Box(Modifier.fillMaxSize().background(Color.Black)){
  AndroidView(factory={ctx->ImageView(ctx).apply{scaleType=ImageView.ScaleType.CENTER_CROP;setImageResource(R.drawable.welcome)}},modifier=Modifier.fillMaxSize())
  Box(Modifier.align(Alignment.BottomCenter).padding(start=34.dp,end=34.dp,bottom=138.dp).fillMaxWidth().height(78.dp).clickable{next()})
  Text("Нажимая «Заполнить анкету», я соглашаюсь на обработку персональных данных в соответствии с политикой конфиденциальности.",fontSize=11.sp,color=Color(0xFF6E6E73),modifier=Modifier.align(Alignment.BottomCenter).padding(start=28.dp,end=28.dp,bottom=34.dp),lineHeight=15.sp)
 }
}'''
          if old not in s:
              if 'setImageResource(R.drawable.welcome)' in s:
                  raise SystemExit('Welcome screen already applied')
              raise SystemExit('Expected Welcome function not found; refusing unsafe edit')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f welcome.ready welcome.part*.b64
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply approved Frost Fitness welcome screen'
          git push
